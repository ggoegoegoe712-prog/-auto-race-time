<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>AUTO RACE TIME</title>
<style>
*{box-sizing:border-box}
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{margin:0;background:#050505;color:#f4e7b5}
header{position:relative;overflow:hidden;background:linear-gradient(145deg,#050505,#17130a 60%,#090806);color:#d7b45a;padding:calc(19px + env(safe-area-inset-top)) 16px 18px;letter-spacing:.08em;border-bottom:1px solid #5b4618;box-shadow:0 8px 30px #000}
header:after{content:"RACE TIME ANALYZER  /  DATA MODE";display:block;font-size:8px;letter-spacing:.25em;color:#9c8449;margin-top:5px}
main{max-width:760px;margin:auto;padding:12px}
.card{background:linear-gradient(145deg,#11100d,#0a0a09);border:1px solid #3c3119;border-radius:15px;padding:12px;margin-bottom:10px;box-shadow:0 10px 28px #0009}
.rules{font-size:11px;color:#c3aa6a;line-height:1.55}
.rules b{color:#f1d98d}
.tablewrap{padding:0;overflow:hidden}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px}
thead th{background:#1a160c;color:#d8b960;font-weight:800;padding:8px 2px;border-bottom:1px solid #5b4618}
tbody tr{background:#0b0b09}
tbody tr:nth-child(even){background:#11100d}
th:nth-child(1){width:8%}th:nth-child(2){width:15%}th:nth-child(3){width:15%}th:nth-child(4){width:17%}th:nth-child(5){width:22%}th:nth-child(6){width:9%}th:nth-child(7){width:24%}
td{padding:7px 2px;text-align:center;border-bottom:1px solid #292314;color:#f0d88e}
tbody tr:last-child td{border-bottom:0}
input{width:100%;height:39px;border:1px solid #5a481f;border-radius:8px;background:#060606;padding:0 2px;text-align:center;font-size:15px;color:#ffe7a1;outline:none;box-shadow:inset 0 1px 3px #000}
input:focus{border-color:#d3ad4e;background:#0b0905;box-shadow:0 0 0 2px #d3ad4e22,inset 0 1px 3px #000}
.car{font-weight:900;font-size:16px;color:#ffd76a}
.up{font-weight:900;font-size:13px;color:#ffe29a}
.range{font-size:10px;font-weight:800;line-height:1.25;color:#d6b96c}
.highlight{font-size:11px;font-weight:950;color:#ffe08a}
button{width:100%;height:44px;border:1px solid #8d6b24;border-radius:10px;font-size:15px;font-weight:800;letter-spacing:.06em}
.primary{background:linear-gradient(180deg,#f1d477,#a77b20);color:#171107;border-color:#e0bc55;box-shadow:0 6px 18px #0009}
.secondary{background:#17130b;color:#d8bb72;margin-top:7px}
.rankrow{display:flex;align-items:center;padding:9px 3px;border-bottom:1px solid #292314}
.rankrow:last-child{border-bottom:0}
.rn{width:42px;font-weight:900;color:#b4934d}.rc{width:52px;font-weight:900;color:#eed28a}.rv{margin-left:auto;font-size:18px;font-weight:950;color:#ffe19a}.small{font-size:11px;color:#b79b5d}
@media(max-width:430px){table{font-size:9px}input{height:36px;font-size:14px}.range{font-size:9px}.highlight{font-size:10px}thead th{padding:7px 1px}td{padding:6px 1px}}
</style>
</head>
<body>
<header>AUTO RACE TIME</header>
<main>
<div class="card rules">
<b>計算</b>：上がり想定＝試走＋偏差。上がり想定幅＝上がり想定±0.010秒。
ハンデ込み＝基準タイム＋ハンデ（10m＝0.010秒）。ランキングはハンデ込み中心値の速い順。
</div>

<div class="card tablewrap">
<table>
<thead><tr>
<th>車</th><th>試走</th><th>偏差</th><th>上がり想定</th><th>上がり想定幅</th><th>ハンデ</th><th>ハンデ込み</th>
</tr></thead>
<tbody id="body"></tbody>
</table>
</div>

<div class="card">
<button class="primary" onclick="update()">ランキング更新</button>
<button class="secondary" onclick="resetAll()">リセット</button>
</div>

<div class="card">
<b>ハンデ込みランキング</b>
<div id="ranking" class="small" style="margin-top:5px">入力すると表示されます。</div>
</div>
</main>

<script>
const body=document.getElementById('body');
for(let i=1;i<=8;i++){
 body.insertAdjacentHTML('beforeend',`
 <tr>
  <td class="car">${i}</td>
  <td><input id="t${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="3.320"></td>
  <td><input id="d${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="+.080"></td>
  <td class="up" id="up${i}">---</td>
  <td class="range" id="base${i}">---</td>
  <td><input id="h${i}" type="text" inputmode="numeric" autocomplete="off" placeholder="20"></td>
  <td class="range highlight" id="hand${i}">---</td>
 </tr>`);
}
function val(id){let x=parseFloat(document.getElementById(id).value);return Number.isFinite(x)?x:null}
function fmt(x){return x.toFixed(3)}
function update(){
 const a=[];
 for(let i=1;i<=8;i++){
  const t=val('t'+i),d=val('d'+i),h=val('h'+i);
  if(t===null||d===null){document.getElementById('up'+i).textContent='---';document.getElementById('base'+i).textContent='---';document.getElementById('hand'+i).textContent='---';continue}
  const up=t+d, lo=up-.01, hi=up+.01, hh=(h??0)*.001;
  document.getElementById('up'+i).textContent=fmt(up);
  document.getElementById('base'+i).textContent=fmt(lo)+'〜'+fmt(hi);
  document.getElementById('hand'+i).textContent=fmt(lo+hh)+'〜'+fmt(hi+hh);
  a.push({i,v:up+hh});
 }
 a.sort((x,y)=>x.v-y.v);
 document.getElementById('ranking').innerHTML=a.length?a.map((x,k)=>`<div class="rankrow"><span class="rn">${k+1}位</span><span class="rc">車${x.i}</span><span class="rv">${fmt(x.v)}</span></div>`).join(''):'入力すると表示されます。';
}
document.querySelectorAll('input').forEach(x=>{x.addEventListener('input',update);x.addEventListener('change',update)});
function resetAll(){document.querySelectorAll('input').forEach(x=>x.value='');update()}
update();
</script>
</body>
</html>
