<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AUTO RACE TIME</title>
<style>
*{box-sizing:border-box}
:root{--bg:#050a11;--panel:#07131f;--line:#164b73;--text:#f5f7fb;--muted:#93a7bd;--cyan:#54d2ff;--cyan2:#9de7ff;--gold:#f4be3b;--gold2:#ffd976;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans JP",sans-serif}
html,body{margin:0;background:radial-gradient(circle at 50% -10%,#0a2139 0,#06111d 28%,#02060b 62%,#010203 100%);color:var(--text);min-height:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
header{padding:calc(30px + env(safe-area-inset-top)) 20px 26px;background:linear-gradient(180deg,rgba(3,8,14,.75),rgba(2,7,12,.2));border-bottom:1px solid #123653;box-shadow:0 14px 35px #0008}
.brand{max-width:820px;margin:auto;display:flex;align-items:center;gap:14px}
.gauge{width:58px;height:58px;border-radius:50%;border:2px solid #1aa9ff;box-shadow:0 0 18px #0a7dd766,inset 0 0 16px #0a7dd733;position:relative;flex:none}
.gauge:before{content:"";position:absolute;left:27px;top:10px;width:2px;height:25px;background:#62d4ff;transform:rotate(42deg);transform-origin:bottom;box-shadow:0 0 8px #62d4ff}
.gauge:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#7ce3ff;left:23px;top:23px;box-shadow:0 0 10px #48cfff}
.logo-title{font-size:clamp(24px,7vw,42px);font-weight:900;font-style:italic;letter-spacing:.035em;line-height:1;text-shadow:0 2px 0 #53677d,0 0 18px #2c84c433}
.logo-sub{margin-top:9px;font-size:10px;letter-spacing:.32em;color:#8eb3d3;font-weight:700}
main{max-width:820px;margin:auto;padding:20px 14px 34px}
.panel{background:linear-gradient(145deg,rgba(8,23,38,.96),rgba(3,12,20,.98));border:1px solid #17507a;border-radius:18px;box-shadow:0 14px 34px #0009,inset 0 0 30px #0a47721a;margin-bottom:16px;overflow:hidden}
.rules{padding:16px 17px;font-size:12px;line-height:1.85;color:#c5d3e0}.rules b{color:#fff}.rules strong{color:var(--cyan)}
.table-shell{overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{padding:10px 2px;background:linear-gradient(180deg,#0a2237,#071827);border-bottom:1px solid #236189;color:#edf7ff;font-size:10px;line-height:1.15}
tbody tr{background:rgba(3,12,20,.85)}tbody tr:nth-child(even){background:rgba(7,20,33,.9)}
td{padding:8px 2px;border-bottom:1px solid #10304a;text-align:center;vertical-align:middle}tbody tr:last-child td{border-bottom:0}
th:nth-child(1){width:8%}th:nth-child(2){width:15%}th:nth-child(3){width:15%}th:nth-child(4){width:18%}th:nth-child(5){width:21%}th:nth-child(6){width:10%}th:nth-child(7){width:20%}
.carbadge{margin:auto;width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:950;border:1px solid #ffffff44;box-shadow:0 3px 10px #0008}
.car-1{background:#121212;color:#fff}.car-2{background:#f3f3f3;color:#111}.car-3{background:#d91515;color:#fff}.car-4{background:#126bd4;color:#fff}.car-5{background:#f5d830;color:#111}.car-6{background:#2aa13d;color:#fff}.car-7{background:#ef6c12;color:#111}.car-8{background:#dd55af;color:#111}
input,select{width:100%;height:42px;border:1px solid #335f80;border-radius:10px;background:linear-gradient(180deg,#08111b,#050b12);color:#fff;text-align:center;font-size:15px;font-weight:750;outline:none;box-shadow:inset 0 0 0 1px #061524,0 2px 10px #0005}
input::placeholder{color:#78899a;opacity:.72}input:focus,select:focus{border-color:#43c8ff;box-shadow:0 0 0 2px #43c8ff22,0 0 15px #0e8fdb33}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#b9ddf5 50%),linear-gradient(135deg,#b9ddf5 50%,transparent 50%),linear-gradient(180deg,#0a1a29,#07111c);background-position:calc(50% + 15px) 18px,calc(50% + 20px) 18px,0 0;background-size:5px 5px,5px 5px,100% 100%;background-repeat:no-repeat;padding-right:18px}
.up{font-size:14px;font-weight:950;color:var(--cyan);text-shadow:0 0 10px #47cfff33}.range{font-size:10px;font-weight:850;color:var(--cyan2);line-height:1.15}.hand-range{font-size:10px;font-weight:950;color:var(--gold2);line-height:1.15}
.actions{padding:15px}button{width:100%;height:54px;border-radius:13px;font-size:16px;font-weight:900;letter-spacing:.03em;cursor:pointer}
.primary{color:#fff;border:1px solid #28a4ff;background:linear-gradient(180deg,#1472e7,#073c92);box-shadow:inset 0 1px 0 #8ed8ff55,0 0 18px #0876d755}.secondary{margin-top:10px;color:#f3f7fb;border:1px solid #28618b;background:linear-gradient(180deg,#091827,#06101a)}
.rank-card{padding:18px 16px 8px}.rank-title{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:950;margin-bottom:4px}.trophy{font-size:23px}.rank-note{font-size:10px;color:#8ea1b6;margin-left:auto;border:1px solid #264961;border-radius:999px;padding:5px 8px}
.rank-head,.rankrow{display:grid;grid-template-columns:54px 1fr 94px 60px;align-items:center}.rank-head{padding:10px 4px 8px;color:#899db2;font-size:10px;border-bottom:1px solid #16354d}.rankrow{padding:14px 4px;border-bottom:1px solid #16354d}.rankrow:last-child{border-bottom:0}
.rn{font-weight:950}.rc{font-weight:850}.rv{font-size:20px;font-weight:950;color:var(--gold)}.diff{font-size:12px;color:#d6e1ec;text-align:right}.rankrow.top1 .rn,.rankrow.top1 .rv{color:#f6c13d}.rankrow.top2 .rn{color:#dce4ed}.rankrow.top3 .rn{color:#de7b27}.empty{padding:12px 2px 16px;color:#8fa2b7;font-size:12px}
@media(max-width:430px){main{padding-left:8px;padding-right:8px}.panel{border-radius:16px}.brand{gap:10px}.gauge{width:46px;height:46px}.gauge:before{left:22px;top:8px;height:20px}.gauge:after{left:18px;top:19px}.logo-title{font-size:27px}.logo-sub{font-size:8px}thead th{font-size:8.5px}td{padding:7px 1px}input,select{height:40px;font-size:14px;border-radius:9px}.carbadge{width:28px;height:28px;font-size:15px}.up{font-size:12px}.range,.hand-range{font-size:8.5px}.rank-card{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header><div class="brand"><div class="gauge" aria-hidden="true"></div><div><div class="logo-title">AUTO RACE TIME</div><div class="logo-sub">RACE TIME ANALYZER / DATA MODE</div></div></div></header>
<main>
<section class="panel rules"><b>計算：</b> 上がり想定＝試走＋偏差。上がり想定幅＝上がり想定±0.010秒。<br>試走は <strong>「334→3.34」</strong>、偏差は <strong>「0063→0.063」</strong> に自動変換。<br>ハンデ込み＝上がり想定幅＋ハンデ（10m＝0.010秒）。</section>
<section class="panel table-shell"><table><thead><tr><th>車</th><th>試走<br>(秒)</th><th>偏差<br>(秒)</th><th>上がり想定<br>(秒)</th><th>上がり想定幅<br>(秒)</th><th>ハンデ<br>(m)</th><th>ハンデ込み<br>(秒)</th></tr></thead><tbody id="body"></tbody></table></section>
<section class="panel actions"><button class="primary" type="button" onclick="update()">↻ ランキング更新</button><button class="secondary" type="button" onclick="resetAll()">↻ リセット</button></section>
<section class="panel rank-card"><div class="rank-title"><span class="trophy">🏆</span>ハンデ込みランキング<span class="rank-note">表示基準：中央値</span></div><div id="rankHeader" class="rank-head" style="display:none"><span>順位</span><span>車番</span><span>ハンデ込み</span><span>差</span></div><div id="ranking" class="empty">入力すると表示されます。</div></section>
</main>
<script>
const body=document.getElementById('body');
for(let i=1;i<=8;i++){body.insertAdjacentHTML('beforeend',`<tr><td><div class="carbadge car-${i}">${i}</div></td><td><input id="t${i}" type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="3.30" aria-label="${i}号車 試走"></td><td><input id="d${i}" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="0.050" aria-label="${i}号車 偏差"></td><td class="up" id="up${i}">---</td><td class="range" id="base${i}">---</td><td><select id="h${i}" aria-label="${i}号車 ハンデ">${Array.from({length:11},(_,n)=>`<option value="${n*10}">${n*10}</option>`).join('')}</select></td><td class="hand-range" id="hand${i}">---</td></tr>`);}
function normalizeTime(el){const raw=el.value.trim();if(!raw)return null;if(raw.includes('.')){const x=Number(raw);return Number.isFinite(x)?x:null;}const digits=raw.replace(/\D/g,'');if(digits.length===3){el.value=digits[0]+'.'+digits.slice(1);}else if(digits.length===4){el.value=digits[0]+'.'+digits.slice(1,3);}const x=Number(el.value);return Number.isFinite(x)?x:null;}
function normalizeDev(el){const raw=el.value.trim();if(!raw)return null;if(raw.includes('.')){const x=Number(raw);return Number.isFinite(x)?x:null;}const digits=raw.replace(/\D/g,'');if(digits.length===4){el.value='0.'+digits.slice(1);}else if(digits.length===3){el.value='0.'+digits.padStart(3,'0');}const x=Number(el.value);return Number.isFinite(x)?x:null;}
function getH(i){const x=Number(document.getElementById('h'+i).value);return Number.isFinite(x)?x:0}
function fmt3(x){return x.toFixed(3)}
function update(){const rows=[];for(let i=1;i<=8;i++){const t=normalizeTime(document.getElementById('t'+i)),d=normalizeDev(document.getElementById('d'+i)),h=getH(i);if(t===null||d===null){document.getElementById('up'+i).textContent='---';document.getElementById('base'+i).textContent='---';document.getElementById('hand'+i).textContent='---';continue;}const up=t+d,lo=up-.010,hi=up+.010,handicap=h*.001,hlo=lo+handicap,hhi=hi+handicap,mid=up+handicap;document.getElementById('up'+i).textContent=fmt3(up);document.getElementById('base'+i).textContent=fmt3(lo)+'〜'+fmt3(hi);document.getElementById('hand'+i).textContent=fmt3(hlo)+'〜'+fmt3(hhi);rows.push({i,v:mid});}rows.sort((a,b)=>a.v-b.v);const rank=document.getElementById('ranking'),head=document.getElementById('rankHeader');if(!rows.length){head.style.display='none';rank.className='empty';rank.textContent='入力すると表示されます。';return;}const best=rows[0].v;head.style.display='grid';rank.className='';rank.innerHTML=rows.map((x,k)=>{const diff=x.v-best,cls=k===0?'top1':k===1?'top2':k===2?'top3':'',icon=k===0?'🏆 ':k===1?'🥈 ':k===2?'🥉 ':'';return `<div class="rankrow ${cls}"><span class="rn">${icon}${k+1}位</span><span class="rc">${x.i}号車</span><span class="rv">${fmt3(x.v)}</span><span class="diff">${diff===0?'0.000':'+'+fmt3(diff)}</span></div>`}).join('');}
document.querySelectorAll('input').forEach(el=>{el.addEventListener('blur',update);el.addEventListener('change',update);el.addEventListener('input',()=>{if(el.id.startsWith('t')&&el.value.replace(/\D/g,'').length>=3)update();if(el.id.startsWith('d')&&el.value.replace(/\D/g,'').length>=4)update();});});
document.querySelectorAll('select').forEach(el=>el.addEventListener('change',update));
function resetAll(){document.querySelectorAll('input').forEach(el=>el.value='');document.querySelectorAll('select').forEach(el=>el.value='0');update()}update();
</script>
</body>
</html>
