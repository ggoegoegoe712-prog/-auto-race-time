<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>AUTO RACE TIME</title>
<style>
*{box-sizing:border-box}
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{margin:0;background:#0B1220;color:#F1F4F8}
header{background:linear-gradient(145deg,#08111f,#10233a);color:#F1F4F8;padding:calc(19px + env(safe-area-inset-top)) 16px 18px;letter-spacing:.08em;border-bottom:1px solid #29415e;box-shadow:0 8px 30px #0008}
header:after{content:"RACE TIME ANALYZER  /  DATA MODE";display:block;font-size:8px;letter-spacing:.25em;color:#7f94ad;margin-top:5px}
main{max-width:760px;margin:auto;padding:12px}
.card{background:linear-gradient(145deg,#111C2D,#0E1725);border:1px solid #22354d;border-radius:15px;padding:12px;margin-bottom:10px;box-shadow:0 10px 28px #0007}
.rules{font-size:11px;color:#9FB0C3;line-height:1.55}.rules b{color:#F1F4F8}
.tablewrap{padding:0;overflow:hidden}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px}
thead th{background:#18283D;color:#D4DEE8;font-weight:800;padding:8px 2px;border-bottom:1px solid #314B68}
tbody tr{background:#0E1725}tbody tr:nth-child(even){background:#111D2D}
th:nth-child(1){width:8%}th:nth-child(2){width:15%}th:nth-child(3){width:15%}th:nth-child(4){width:17%}th:nth-child(5){width:22%}th:nth-child(6){width:9%}th:nth-child(7){width:24%}
td{padding:7px 2px;text-align:center;border-bottom:1px solid #1D2B3D;color:#F1F4F8}tbody tr:last-child td{border-bottom:0}
input,select{width:100%;height:39px;border:1px solid #35516F;border-radius:8px;background:#151F30;padding:0 2px;text-align:center;font-size:15px;color:#F1F4F8;outline:none;box-shadow:inset 0 1px 3px #0005}
select{-webkit-appearance:none;appearance:none;text-align-last:center}
input:focus,select:focus{border-color:#63D5FF;background:#17283D;box-shadow:0 0 0 2px #63D5FF22,inset 0 1px 3px #000}
.car{font-weight:900;font-size:16px;color:#F1F4F8}
.up{font-weight:900;font-size:13px;color:#63D5FF}
.range{font-size:10px;font-weight:800;line-height:1.25;color:#A9DFF0}
.highlight{font-size:11px;font-weight:950;color:#FFD166}
button{width:100%;height:44px;border:1px solid #3A5878;border-radius:10px;font-size:15px;font-weight:800;letter-spacing:.06em}
.primary{background:linear-gradient(180deg,#E7EDF3,#A8B8C8);color:#0B1220;border-color:#C8D4DF;box-shadow:0 6px 18px #0007}
.secondary{background:#16253A;color:#D0DAE4;margin-top:7px}
.rankrow{display:flex;align-items:center;padding:9px 3px;border-bottom:1px solid #1D2B3D}.rankrow:last-child{border-bottom:0}
.rn{width:42px;font-weight:900;color:#A6B5C5}.rc{width:52px;font-weight:900;color:#F1F4F8}.rv{margin-left:auto;font-size:18px;font-weight:950;color:#FFD166}.small{font-size:11px;color:#93A5B8}
@media(max-width:430px){table{font-size:9px}input,select{height:36px;font-size:14px}.range{font-size:9px}.highlight{font-size:10px}thead th{padding:7px 1px}td{padding:6px 1px}}
</style>
</head>
<body>
<header>AUTO RACE TIME</header>
<main>
<div class="card rules">
<b>計算</b>：上がり想定＝試走＋偏差。上がり想定幅＝上がり想定±0.010秒。<br>
試走は「3343→3.343」、偏差は「0063→0.063」に自動変換。ハンデ込み＝上がり想定幅＋ハンデ（10m＝0.010秒）。
</div>

<div class="card tablewrap">
<table>
<thead><tr>
<th>車</th><th>試走</th><th>偏差</th><th>上がり想定</th><th>上がり想定幅</th><th>ハンデ</th><th>ハンデ込み</th>
</tr></thead>
<tbody id="body"></tbody>
</table>
</div>

<div class="card">
<button class="primary" onclick="update()">ランキング更新</button>
<button class="secondary" onclick="resetAll()">リセット</button>
</div>

<div class="card">
<b>ハンデ込みランキング</b>
<div id="ranking" class="small" style="margin-top:5px">入力すると表示されます。</div>
</div>
</main>

<script>
const body=document.getElementById('body');
for(let i=1;i<=8;i++){
 body.insertAdjacentHTML('beforeend',`
 <tr>
  <td class="car">${i}</td>
  <td><input id="t${i}" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="3343"></td>
  <td><input id="d${i}" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="0063"></td>
  <td class="up" id="up${i}">---</td>
  <td class="range" id="base${i}">---</td>
  <td><select id="h${i}" aria-label="${i}号車ハンデ">${Array.from({length:11},(_,n)=>`<option value="${n*10}">${n*10}</option>`).join('')}</select></td>
  <td class="range highlight" id="hand${i}">---</td>
 </tr>`);
}
function autoFormatInput(el, kind){
 let v=el.value.trim();
 if(v.includes('.')) return;
 const digits=v.replace(/\D/g,'');
 if(digits.length!==4) return;
 el.value = kind==='time'
   ? digits[0]+'.'+digits.slice(1)
   : '0.'+digits.slice(1);
}
function val(id){
 const el=document.getElementById(id);
 const kind=id.startsWith('t')?'time':id.startsWith('d')?'dev':'normal';
 if(kind!=='normal') autoFormatInput(el,kind);
 let x=parseFloat(el.value);
 return Number.isFinite(x)?x:null;
}
function fmt(x){return x.toFixed(3)}
function update(){
 const a=[];
 for(let i=1;i<=8;i++){
  const t=val('t'+i),d=val('d'+i),h=val('h'+i);
  if(t===null||d===null){document.getElementById('up'+i).textContent='---';document.getElementById('base'+i).textContent='---';document.getElementById('hand'+i).textContent='---';continue}
  const up=t+d, lo=up-.01, hi=up+.01, hh=(h??0)*.001;
  document.getElementById('up'+i).textContent=fmt(up);
  document.getElementById('base'+i).textContent=fmt(lo)+'〜'+fmt(hi);
  document.getElementById('hand'+i).textContent=fmt(lo+hh)+'〜'+fmt(hi+hh);
  a.push({i,v:up+hh});
 }
 a.sort((x,y)=>x.v-y.v);
 document.getElementById('ranking').innerHTML=a.length?a.map((x,k)=>`<div class="rankrow"><span class="rn">${k+1}位</span><span class="rc">${x.i}号車</span><span class="rv">${fmt(x.v)}</span></div>`).join(''):'入力すると表示されます。';
}
document.querySelectorAll('input').forEach(x=>{
 x.addEventListener('input',()=>{
  autoFormatInput(x,x.id.startsWith('t')?'time':'dev');
  update();
 });
 x.addEventListener('change',update);
});
document.querySelectorAll('select').forEach(x=>x.addEventListener('change',update));
function resetAll(){document.querySelectorAll('input').forEach(x=>x.value='');document.querySelectorAll('select').forEach(x=>x.value='0');update()}
update();
</script>
</body>
</html>
